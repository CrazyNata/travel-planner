name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_LEGAL_ENTITY_NAME: ${{ vars.VITE_LEGAL_ENTITY_NAME }}
          VITE_LEGAL_CONTACT_EMAIL: ${{ vars.VITE_LEGAL_CONTACT_EMAIL }}
          VITE_LEGAL_EFFECTIVE_DATE: ${{ vars.VITE_LEGAL_EFFECTIVE_DATE }}
      - name: Verify the bundled Android download
        shell: bash
        run: |
          # Vite copies public/travel-planner.apk into dist during the build.
          # Keep the website deploy independent from GitHub release asset names.
          test -s public/travel-planner.apk
          test -s dist/travel-planner.apk
          mkdir -p dist/.well-known
          cp public/.well-known/assetlinks.json dist/.well-known/assetlinks.json
          test -s dist/.well-known/assetlinks.json
      - uses: actions/configure-pages@v5
      - name: Package GitHub Pages artifact with App Links metadata
        shell: bash
        run: |
          tar --dereference --hard-dereference \
            --directory dist \
            --exclude=.git \
            --exclude=.github \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -qx './.well-known/assetlinks.json'
      - uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@v4
