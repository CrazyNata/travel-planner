name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://hxcavgtlucyoqudbrgse.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      IOS_QA_EMAIL: ${{ secrets.IOS_QA_EMAIL }}
      IOS_QA_PASSWORD: ${{ secrets.IOS_QA_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Apple toolchain
        run: |
          xcode-select --print-path
          xcodebuild -version

      - name: Prepare public app configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          python3 - <<'PY'
          import os
          from pathlib import Path

          if "REPLACE" in os.environ["SUPABASE_PUBLISHABLE_KEY"].upper():
              raise SystemExit("Configure the SUPABASE_PUBLISHABLE_KEY repository secret.")

          config = Path(os.environ["RUNNER_TEMP"]) / "RamingoSimulator.xcconfig"
          config.write_text(
              "SUPABASE_URL = " + os.environ["SUPABASE_URL"].replace("://", ":/$()/") + "\n"
              "SUPABASE_PUBLISHABLE_KEY = " + os.environ["SUPABASE_PUBLISHABLE_KEY"] + "\n"
              "PRODUCT_BUNDLE_IDENTIFIER = com.odyssey.ramingo.ios\n"
          )
          config.chmod(0o600)
          PY

      - name: Build unsigned iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          build_log="$RUNNER_TEMP/ramingo-ios-build.log"
          xcodebuild \
            -project ios/Ramingo.xcodeproj \
            -scheme Ramingo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/RamingoDerivedData" \
            -xcconfig "$RUNNER_TEMP/RamingoSimulator.xcconfig" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$build_log"
          test -d "$RUNNER_TEMP/RamingoDerivedData/Build/Products/Debug-iphonesimulator/Ramingo.app"

      - name: Boot iPhone Simulator and launch app
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/RamingoDerivedData/Build/Products/Debug-iphonesimulator/Ramingo.app"
          smoke_log="$RUNNER_TEMP/ramingo-ios-simulator-smoke.log"
          screenshot_path="$RUNNER_TEMP/ramingo-ios-simulator.png"
          video_path="$RUNNER_TEMP/ramingo-ios-simulator.mp4"
          video_log="$RUNNER_TEMP/ramingo-ios-simulator-record.log"
          test_log="$RUNNER_TEMP/ramingo-ios-ui-tests.log"
          : > "$smoke_log"

          device_udid="$(python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))
          for devices in data.get("devices", {}).values():
              for device in devices:
                  if device.get("name", "").lower().startswith("iphone") and device.get("isAvailable", True):
                      print(device["udid"])
                      raise SystemExit(0)
          PY
          )"

          device_created=false
          if [ -z "$device_udid" ]; then
              device_type="$(python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devicetypes", "-j"],
              text=True,
          ))
          for device in data.get("devicetypes", []):
              name = device.get("name", "").lower()
              if device.get("productFamily") == "iPhone" or "iphone" in name:
                  print(device["identifier"])
                  raise SystemExit(0)
          raise SystemExit("No iPhone Simulator device type is installed.")
          PY
              )"

              runtime="$(python3 - <<'PY'
          import json
          import subprocess

          runtime_data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "runtimes", "-j"],
              text=True,
          ))
          runtimes = [
              item for item in runtime_data["runtimes"]
              if item.get("platform") == "iOS" and "unavailable" not in item.get("availability", "").lower()
          ]
          if not runtimes:
              raise SystemExit("No available iOS Simulator runtime is installed.")
          selected = max(runtimes, key=lambda item: tuple(
              int(part) for part in item["version"].split(".") if part.isdigit()
          ))
          print(selected["identifier"])
          PY
              )"
              device_udid="$(xcrun simctl create 'Ramingo CI iPhone' "$device_type" "$runtime")"
              device_created=true
          fi

          record_pid=""
          capture_path="$screenshot_path"
          stop_recording() {
              if [ -n "$record_pid" ]; then
                  kill -INT "$record_pid" >/dev/null 2>&1 || true
                  for _ in $(seq 1 30); do
                      if ! kill -0 "$record_pid" >/dev/null 2>&1; then
                          break
                      fi
                      sleep 1
                  done
                  if kill -0 "$record_pid" >/dev/null 2>&1; then
                      kill -TERM "$record_pid" >/dev/null 2>&1 || true
                      sleep 1
                  fi
                  if kill -0 "$record_pid" >/dev/null 2>&1; then
                      kill -KILL "$record_pid" >/dev/null 2>&1 || true
                  fi
                  wait "$record_pid" >/dev/null 2>&1 || true
                  record_pid=""
              fi
          }

          cleanup() {
              stop_recording
              xcrun simctl shutdown "$device_udid" >/dev/null 2>&1 || true
              if [ "$device_created" = true ]; then
                  xcrun simctl delete "$device_udid" >/dev/null 2>&1 || true
              fi
          }
          trap cleanup EXIT

          {
              echo "device_udid=$device_udid"
              xcrun simctl boot "$device_udid"
              xcrun simctl bootstatus "$device_udid" -b
              xcrun simctl install "$device_udid" "$app_path"
              xcrun simctl io "$device_udid" recordVideo --codec=h264 "$video_path" >"$video_log" 2>&1 &
              record_pid=$!
              sleep 2
              launch_output="$(xcrun simctl launch "$device_udid" com.odyssey.ramingo.ios)"
              echo "$launch_output"
              pid="$(printf '%s\n' "$launch_output" | sed -nE 's/.*: ([0-9]+)$/\1/p')"
              test -n "$pid"
              sleep 18
              if [ -n "${IOS_QA_EMAIL:-}" ] && [ -n "${IOS_QA_PASSWORD:-}" ]; then
                  echo "Starting authenticated iOS callback smoke."
                  auth_body="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "email": os.environ["IOS_QA_EMAIL"],
              "password": os.environ["IOS_QA_PASSWORD"],
          }))
          PY
                  )"
                  auth_response="$(curl -fsS --max-time 20 \
                      -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
                      -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
                      -H "Content-Type: application/json" \
                      --data "$auth_body")"
                  access_token="$(AUTH_RESPONSE="$auth_response" python3 - <<'PY'
          import json
          import os

          print(json.loads(os.environ["AUTH_RESPONSE"])["access_token"])
          PY
                  )"
                  refresh_token="$(AUTH_RESPONSE="$auth_response" python3 - <<'PY'
          import json
          import os

          print(json.loads(os.environ["AUTH_RESPONSE"])["refresh_token"])
          PY
                  )"
                   test -n "$access_token"
                   test -n "$refresh_token"
                  echo "::add-mask::$access_token"
                  echo "::add-mask::$refresh_token"
                  qa_session_file="$RUNNER_TEMP/ramingo-ios-qa-session.json"
                  QA_SESSION_FILE="$qa_session_file" ACCESS_TOKEN="$access_token" REFRESH_TOKEN="$refresh_token" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["QA_SESSION_FILE"])
          path.write_text(json.dumps({
              "accessToken": os.environ["ACCESS_TOKEN"],
              "refreshToken": os.environ["REFRESH_TOKEN"],
          }), encoding="utf-8")
          path.chmod(0o600)
          PY
                  test -s "$qa_session_file"

                   trip_id=""
                  if trip_response="$(curl -fsS --max-time 20 \
                      "$SUPABASE_URL/rest/v1/trips?select=id&limit=1" \
                      -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
                      -H "Authorization: Bearer $access_token")"; then
                      trip_id="$(TRIP_RESPONSE="$trip_response" python3 - <<'PY'
          import json
          import os

          rows = json.loads(os.environ["TRIP_RESPONSE"])
          print(rows[0].get("id", "") if rows else "")
          PY
                       )"
                   fi

                  echo "Starting authenticated iOS UI tests."
                  IOS_QA_SESSION_FILE="$qa_session_file" \
                  IOS_QA_TRIP_ID="$trip_id" \
                  xcodebuild \
                    -project ios/Ramingo.xcodeproj \
                    -scheme RamingoUITests \
                    -configuration Debug \
                    -destination "platform=iOS Simulator,id=$device_udid" \
                    -derivedDataPath "$RUNNER_TEMP/RamingoDerivedData" \
                    -xcconfig "$RUNNER_TEMP/RamingoSimulator.xcconfig" \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    IOS_QA_SESSION_FILE="$qa_session_file" \
                    IOS_QA_TRIP_ID="$trip_id" \
                    build-for-testing 2>&1 | tee "$test_log"

                  xcrun simctl privacy "$device_udid" grant location com.odyssey.ramingo.ios >/dev/null 2>&1 || true
                  xcrun simctl terminate "$device_udid" com.odyssey.ramingo.ios >/dev/null 2>&1 || true
                  launch_output="$(xcrun simctl launch "$device_udid" com.odyssey.ramingo.ios \
                      -ramingo-qa-access-token "$access_token" \
                      -ramingo-qa-refresh-token "$refresh_token" \
                      -ramingo-qa-trip-id "$trip_id")"
                  echo "$launch_output"
                  pid="$(printf '%s\n' "$launch_output" | sed -nE 's/.*: ([0-9]+)$/\1/p')"
                  test -n "$pid"
                  sleep 60
                  xcrun simctl terminate "$device_udid" com.odyssey.ramingo.ios >/dev/null 2>&1 || true

                  IOS_QA_SESSION_FILE="$qa_session_file" \
                  IOS_QA_TRIP_ID="$trip_id" \
                  xcodebuild \
                    -project ios/Ramingo.xcodeproj \
                    -scheme RamingoUITests \
                    -configuration Debug \
                    -destination "platform=iOS Simulator,id=$device_udid" \
                    -derivedDataPath "$RUNNER_TEMP/RamingoDerivedData" \
                    -xcconfig "$RUNNER_TEMP/RamingoSimulator.xcconfig" \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    IOS_QA_SESSION_FILE="$qa_session_file" \
                    IOS_QA_TRIP_ID="$trip_id" \
                    test-without-building 2>&1 | tee -a "$test_log"
                  grep -Eq 'Executed [0-9]+ tests, with (0 tests skipped and )?0 failures' "$test_log"

                  xcrun simctl privacy "$device_udid" grant location com.odyssey.ramingo.ios >/dev/null 2>&1 || true
                  xcrun simctl terminate "$device_udid" com.odyssey.ramingo.ios >/dev/null 2>&1 || true
                  launch_output="$(xcrun simctl launch "$device_udid" com.odyssey.ramingo.ios \
                      -ramingo-qa-access-token "$access_token" \
                      -ramingo-qa-refresh-token "$refresh_token" \
                      -ramingo-qa-trip-id "$trip_id")"
                  echo "$launch_output"
                  pid="$(printf '%s\n' "$launch_output" | sed -nE 's/.*: ([0-9]+)$/\1/p')"
                  test -n "$pid"
                  sleep 60
                  capture_path="$RUNNER_TEMP/ramingo-ios-authorized.png"
                  echo "Authenticated iOS UI smoke passed${trip_id:+; trip deep link requested}."
              else
                  echo "IOS_QA_EMAIL/IOS_QA_PASSWORD are not configured; launch-only smoke remains active."
              fi
              python3 - "$device_udid" "$capture_path" <<'PY'
          import subprocess
          import sys

          device_udid, screenshot_path = sys.argv[1:]
          subprocess.run(
              ["xcrun", "simctl", "io", device_udid, "screenshot", screenshot_path],
              check=True,
              timeout=45,
          )
          PY
              stop_recording
              test -s "$capture_path"
              test -s "$video_path"
              echo "Simulator smoke test passed: Ramingo launched with pid $pid and produced a screenshot and video."
          } 2>&1 | tee "$smoke_log"

      - name: Remove temporary auth markers from smoke log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          smoke_log="$RUNNER_TEMP/ramingo-ios-simulator-smoke.log"
          if [ -f "$smoke_log" ]; then
              sed -i.bak '/::add-mask::/d' "$smoke_log"
              rm -f "$smoke_log.bak"
          fi

      - name: Upload Simulator build
        uses: actions/upload-artifact@v6
        with:
          name: ramingo-ios-simulator-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/RamingoDerivedData/Build/Products/Debug-iphonesimulator/Ramingo.app
            ${{ runner.temp }}/ramingo-ios-build.log
          if-no-files-found: error

      - name: Upload Simulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ramingo-ios-simulator-smoke-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ramingo-ios-simulator-smoke.log
            ${{ runner.temp }}/ramingo-ios-simulator.png
            ${{ runner.temp }}/ramingo-ios-authorized.png
            ${{ runner.temp }}/ramingo-ios-simulator.mp4
            ${{ runner.temp }}/ramingo-ios-simulator-record.log
            ${{ runner.temp }}/ramingo-ios-ui-tests.log
          if-no-files-found: ignore
