<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ramingo · варианты навигации</title>
  <style>
    :root {
      --bg: #f2f1f6;
      --phone: #f9f8fb;
      --surface: #ffffff;
      --surface-soft: #f0eef7;
      --text: #17171d;
      --muted: #8d8d98;
      --line: #e7e5eb;
      --purple: #6c5ce7;
      --purple-soft: #eeeafd;
      --green: #22a975;
      --shadow: 0 18px 55px rgba(33, 31, 53, .16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, #ffffff 0, transparent 33%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
    }

    .page {
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 54px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 auto 26px;
      width: fit-content;
      color: #696874;
      font-size: 14px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      color: white;
      background: linear-gradient(135deg, #6c5ce7, #886ff0);
      box-shadow: 0 8px 18px rgba(108, 92, 231, .28);
      font-size: 19px;
      font-weight: 900;
    }

    .intro {
      text-align: center;
      margin-bottom: 25px;
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 40px);
      letter-spacing: -.04em;
    }

    .intro p {
      max-width: 670px;
      margin: 10px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .variant-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 0 auto 32px;
    }

    .solo-control {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin: 0 auto 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .78);
    }

    .solo-control strong { display: block; font-size: 12px; }
    .solo-control small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }

    .solo-control button {
      flex: 0 0 auto;
      min-width: 64px;
      padding: 8px 10px;
      border-radius: 10px;
      color: var(--purple);
      background: var(--purple-soft);
      font-size: 11px;
      font-weight: 850;
    }

    .solo-control button.off { color: var(--muted); background: #f0eff4; }

    body.solo-view {
      display: grid;
      min-height: 100vh;
      padding: 24px;
      place-items: center;
    }

    body.solo-view .page {
      width: min(100%, 400px);
      padding: 0;
    }

    body.solo-view .brand,
    body.solo-view .intro,
    body.solo-view .variant-grid,
    body.solo-view .notes,
    body.solo-view .hint {
      display: none;
    }

    body.solo-view .solo-control { display: flex; }

    body.solo-view .workspace {
      display: block;
      width: fit-content;
      margin: 0 auto;
    }

    body.solo-view .phone-wrap {
      margin: 0;
    }

    .variant-card {
      min-height: 102px;
      padding: 14px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, .76);
      transition: .2s ease;
    }

    .variant-card:hover { transform: translateY(-2px); }
    .variant-card.active {
      border-color: var(--purple);
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(108, 92, 231, .15);
    }

    .variant-card .number {
      display: inline-grid;
      place-items: center;
      width: 25px;
      height: 25px;
      margin-bottom: 10px;
      border-radius: 8px;
      color: var(--purple);
      background: var(--purple-soft);
      font-size: 12px;
      font-weight: 900;
    }

    .variant-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .variant-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 400px;
      gap: 58px;
      align-items: start;
      max-width: 960px;
      margin: 0 auto;
    }

    .notes {
      padding-top: 28px;
    }

    .notes h2 {
      margin: 0 0 16px;
      font-size: 22px;
      letter-spacing: -.025em;
    }

    .notes .lead {
      margin: 0 0 24px;
      color: #5f5e68;
      font-size: 15px;
      line-height: 1.55;
    }

    .note-list {
      display: grid;
      gap: 11px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .note-list li {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 11px;
      align-items: start;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, .63);
    }

    .note-list b {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      color: var(--purple);
      background: var(--purple-soft);
      font-size: 12px;
    }

    .note-list strong {
      display: block;
      margin-bottom: 3px;
      font-size: 14px;
    }

    .note-list span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .phone-wrap {
      position: relative;
      width: 400px;
      padding: 12px 10px;
      border-radius: 47px;
      background: #111116;
      box-shadow: var(--shadow), inset 0 0 0 2px #2c2c33;
    }

    .phone {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 380px;
      height: 790px;
      overflow: hidden;
      border-radius: 37px;
      background: var(--phone);
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 34px;
      padding: 6px 23px 0;
      color: #2a2930;
      font-size: 11px;
      font-weight: 800;
    }

    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      flex: 0 0 57px;
      padding: 0 13px;
      border-bottom: 1px solid rgba(0, 0, 0, .06);
      background: var(--phone);
      z-index: 5;
    }

    .back {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin-left: -5px;
      border-radius: 14px;
      background: transparent;
      font-size: 26px;
      font-weight: 400;
    }

    .back:hover { background: var(--surface-soft); }

    .title-trigger {
      flex: 1;
      min-width: 0;
      padding: 4px 8px;
      text-align: center;
      border-radius: 12px;
      background: transparent;
    }

    .title-trigger:hover { background: var(--surface-soft); }
    .title-trigger small {
      display: block;
      overflow: hidden;
      color: #a0a0aa;
      font-size: 9px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .title-trigger strong {
      display: block;
      margin-top: 1px;
      font-size: 15px;
    }

    .title-trigger .chevron {
      display: inline-block;
      margin-left: 3px;
      color: var(--purple);
      transition: .2s ease;
    }

    .title-trigger.open .chevron { transform: rotate(180deg); }
    .topbar-spacer { width: 42px; }

    .content {
      position: relative;
      flex: 1;
      overflow: auto;
      padding: 12px 16px 25px;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar { display: none; }

    .section-kicker {
      margin: 3px 0 7px;
      color: var(--purple);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .12em;
    }

    .content h2 {
      margin: 0 0 5px;
      font-size: 25px;
      letter-spacing: -.04em;
    }

    .subtext {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .hero {
      position: relative;
      height: 205px;
      overflow: hidden;
      margin: 0 0 12px;
      padding: 17px;
      border-radius: 21px;
      color: white;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .02) 20%, rgba(7, 22, 38, .74) 100%),
        linear-gradient(140deg, #c8dbe0 0%, #8aacc0 42%, #1c405e 100%);
    }

    .hero:before {
      position: absolute;
      content: "";
      right: -20px;
      top: 25px;
      width: 210px;
      height: 170px;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(160deg, transparent 10%, rgba(24, 61, 91, .8) 11% 28%, transparent 29% 36%, rgba(18, 57, 86, .83) 37% 60%, transparent 61%);
      transform: rotate(-12deg);
    }

    .hero b {
      position: absolute;
      left: 17px;
      bottom: 16px;
      font-size: 24px;
      letter-spacing: -.03em;
    }

    .dots {
      position: absolute;
      right: 16px;
      top: 17px;
      color: #fff;
      font-size: 13px;
      letter-spacing: 4px;
    }

    .map-card {
      height: 168px;
      overflow: hidden;
      margin-bottom: 16px;
      border-radius: 20px;
      background: linear-gradient(145deg, #d4eee6 0%, #b3d7e6 53%, #8fb6d0 100%);
    }

    .map-card .map-lines {
      position: relative;
      width: 100%;
      height: 128px;
      background:
        linear-gradient(28deg, transparent 47%, rgba(108, 92, 231, .88) 48% 51%, transparent 52%),
        linear-gradient(154deg, transparent 43%, rgba(108, 92, 231, .88) 44% 47%, transparent 48%),
        linear-gradient(8deg, transparent 61%, rgba(108, 92, 231, .88) 62% 65%, transparent 66%);
    }

    .map-card .map-lines:after {
      position: absolute;
      content: "4  ·  7  ·  3  ·  5  ·  9";
      left: 55px;
      top: 42px;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 8px;
      text-shadow: 0 0 0 #fff;
    }

    .map-caption {
      display: flex;
      justify-content: space-between;
      padding: 12px 15px;
      color: var(--muted);
      background: rgba(255, 255, 255, .77);
      font-size: 11px;
      font-weight: 700;
    }

    .map-caption strong { color: var(--text); }

    .panel {
      padding: 15px;
      margin-bottom: 11px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--surface);
      box-shadow: 0 3px 12px rgba(38, 35, 57, .04);
    }

    .panel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-row + .panel-row { margin-top: 12px; }
    .panel strong { font-size: 14px; }
    .panel small { display: block; color: var(--muted); font-size: 11px; }
    .panel .value { color: var(--purple); font-size: 14px; font-weight: 900; }

    .catalog-card {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--line);
      border-radius: 17px;
      text-align: left;
      background: var(--surface);
      box-shadow: 0 3px 12px rgba(38, 35, 57, .04);
    }

    .catalog-card:hover { border-color: #c5bdf5; background: var(--purple-soft); }
    .catalog-card strong { display: block; font-size: 14px; }
    .catalog-card span { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .catalog-card .catalog-meta { margin-top: 11px; color: var(--purple); font-size: 10px; font-weight: 850; }

    .progress {
      height: 7px;
      margin-top: 11px;
      overflow: hidden;
      border-radius: 9px;
      background: #e9e7ef;
    }

    .progress i {
      display: block;
      width: 62%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6c5ce7, #947df0);
    }

    .day-pills {
      display: flex;
      gap: 7px;
      overflow: auto;
      margin: 0 -2px 14px;
      padding: 2px;
      scrollbar-width: none;
    }

    .day-pills::-webkit-scrollbar { display: none; }
    .day-pill {
      flex: 0 0 auto;
      padding: 9px 12px;
      border-radius: 11px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 11px;
      font-weight: 800;
    }

    .day-pill.active {
      color: #fff;
      background: var(--purple);
      box-shadow: 0 6px 14px rgba(108, 92, 231, .22);
    }

    .place-row {
      display: flex;
      gap: 11px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .place-row:last-child { border-bottom: 0; }
    .place-icon {
      display: grid;
      place-items: center;
      flex: 0 0 31px;
      width: 31px;
      height: 31px;
      border-radius: 10px;
      color: var(--purple);
      background: var(--purple-soft);
      font-size: 13px;
    }

    .place-row strong { display: block; font-size: 13px; }
    .place-row small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .check {
      margin-left: auto;
      color: var(--green);
      font-size: 17px;
    }

    .section-menu {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      width: 274px;
      padding: 20px 14px 18px;
      overflow: auto;
      background: var(--surface);
      box-shadow: 13px 0 36px rgba(24, 21, 41, .18);
      transform: translateX(-105%);
      transition: transform .25s ease;
    }

    .section-menu.open { transform: translateX(0); }

    .menu-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 5px 18px;
    }

    .menu-brand .brand-mark { width: 35px; height: 35px; border-radius: 11px; font-size: 17px; }
    .menu-brand strong { display: block; font-size: 14px; }
    .menu-brand small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }

    .menu-label {
      margin: 10px 6px 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .12em;
    }

    .menu-divider {
      height: 1px;
      margin: 12px 6px 4px;
      background: var(--line);
    }

    .menu-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      scrollbar-width: none;
    }

    .menu-scroll::-webkit-scrollbar { display: none; }

    .menu-bottom {
      flex: 0 0 auto;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .menu-settings { margin: 0; padding: 0; border: 0; }
    .menu-settings .menu-label { margin-top: 0; }
    .menu-bottom .menu-footer { margin-top: 0; border-top: 0; padding-top: 8px; }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 12px 11px;
      margin-bottom: 2px;
      border-radius: 13px;
      text-align: left;
      background: transparent;
      font-size: 13px;
      font-weight: 750;
    }

    .menu-item:hover, .menu-item.active { color: var(--purple); background: var(--purple-soft); }
    .menu-icon { width: 22px; text-align: center; font-size: 16px; }

    .hamburger-button {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin-left: -5px;
      border-radius: 13px;
      color: var(--text);
      background: transparent;
      font-size: 21px;
      line-height: 1;
    }

    .hamburger-button:hover { background: var(--surface-soft); }

    .hamburger-title {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    .hamburger-title small {
      display: block;
      overflow: hidden;
      color: #a0a0aa;
      font-size: 9px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hamburger-title strong {
      display: block;
      margin-top: 1px;
      font-size: 15px;
    }

    .menu-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: auto;
      padding: 12px 11px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
      text-align: left;
      font-size: 12px;
      font-weight: 750;
    }

    .menu-footer:hover { color: var(--purple); }

    .menu-backdrop {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: rgba(14, 12, 22, .42);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .menu-backdrop.open { opacity: 1; pointer-events: auto; }

    .tabs-strip {
      display: flex;
      gap: 18px;
      overflow: auto;
      flex: 0 0 47px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: var(--phone);
      scrollbar-width: none;
    }

    .tabs-strip::-webkit-scrollbar { display: none; }
    .strip-item {
      position: relative;
      flex: 0 0 auto;
      padding: 15px 1px 11px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }

    .strip-item.active { color: var(--text); }
    .strip-item.active:after {
      position: absolute;
      content: "";
      right: 0;
      bottom: 0;
      left: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: var(--purple);
    }

    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      flex: 0 0 68px;
      padding: 7px 7px 10px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .95);
    }

    .bottom-item {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      border-radius: 13px;
      color: var(--muted);
      background: transparent;
      font-size: 10px;
      font-weight: 850;
    }

    .bottom-item .bottom-icon { font-size: 18px; line-height: 19px; }
    .bottom-item.active { color: var(--purple); background: var(--purple-soft); }

    .group-sheet {
      position: absolute;
      right: 10px;
      bottom: 77px;
      left: 10px;
      z-index: 26;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, .98);
      box-shadow: 0 12px 30px rgba(33, 31, 53, .2);
    }

    .group-sheet h3 {
      margin: 2px 3px 9px;
      font-size: 12px;
    }

    .group-sheet-item {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 9px;
      padding: 10px 9px;
      border-radius: 11px;
      text-align: left;
      background: transparent;
      font-size: 12px;
      font-weight: 750;
    }

    .group-sheet-item:hover, .group-sheet-item.active { color: var(--purple); background: var(--purple-soft); }

    .grid-menu {
      position: absolute;
      inset: 0;
      z-index: 28;
      padding: 17px 15px;
      overflow: auto;
      background: rgba(249, 248, 251, .98);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: .23s ease;
    }

    .grid-menu.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .grid-menu-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .grid-menu-header strong { font-size: 18px; }
    .grid-menu-close { width: 32px; height: 32px; border-radius: 10px; background: var(--surface-soft); font-size: 18px; }
    .grid-menu p { margin: 0 0 14px; color: var(--muted); font-size: 11px; }
    .grid-menu-list { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .grid-menu-item {
      min-height: 94px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 15px;
      text-align: left;
      background: var(--surface);
    }
    .grid-menu-item:hover, .grid-menu-item.active { border-color: var(--purple); background: var(--purple-soft); }
    .grid-menu-item .menu-icon { display: block; margin-bottom: 10px; }
    .grid-menu-item strong { display: block; font-size: 12px; }

    .date-strip {
      display: flex;
      gap: 7px;
      overflow: auto;
      margin: 0 -2px 15px;
      padding: 2px;
      scrollbar-width: none;
    }

    .date-strip::-webkit-scrollbar { display: none; }

    .date-cell {
      display: grid;
      flex: 0 0 48px;
      place-items: center;
      gap: 2px;
      min-height: 58px;
      border-radius: 14px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 10px;
      font-weight: 800;
    }

    .date-cell strong { color: inherit; font-size: 16px; }
    .date-cell.active { color: #fff; background: var(--purple); box-shadow: 0 6px 14px rgba(108, 92, 231, .22); }

    .timeline {
      position: relative;
      padding-left: 12px;
    }

    .timeline:before {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 27px;
      width: 2px;
      content: "";
      background: #ded9f5;
    }

    .timeline-item {
      position: relative;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding-bottom: 13px;
    }

    .timeline-dot {

      return sheet + '<nav class="bottom-nav">' + groups.map(group => {
        const icon = group === "Обзор" ? "⌂" : group === "План" ? "⌁" : group === "Брони" ? "♨" : "•••";
        return '<button class="bottom-item ' + (activeGroup === group ? "active" : "") + '" data-group="' + group + '"><span class="bottom-icon">' + icon + '</span><span>' + group + '</span></button>';
      }).join("") + '</nav>';
    }

    function gridMarkup() {
      return '<div class="grid-menu ' + (gridOpen ? "open" : "") + '"><div class="grid-menu-header"><strong>Разделы поездки</strong><button class="grid-menu-close" data-action="close-grid">×</button></div><p>Выберите, что открыть в путешествии.</p><div class="grid-menu-list">' +
        sections.map(item => '<button class="grid-menu-item ' + (item.id === activeSection ? "active" : "") + '" data-section="' + item.id + '"><span class="menu-icon">' + item.icon + '</span><strong>' + item.label + '</strong></button>').join("") +
        '</div></div>';
    }

    function phoneMarkup() {
      const isStrip = activeVariant === "strip";
      const isGroups = activeVariant === "groups";
      const isGrid = activeVariant === "grid";
      const isTimeline = activeVariant === "timeline";
      const isMap = activeVariant === "map";
      const isDashboard = activeVariant === "dashboard";
      const isHub = activeVariant === "hub";
      const isNested = activeVariant === "nested";
      const isQuick = activeVariant === "quick";
      const isHamburger = activeVariant === "hamburger";
      const showsGrid = isGrid || isTimeline || isMap || isDashboard;
      const mainContent = isHamburger
        ? (hamburgerScreen === "trips" ? tripsContent() : hamburgerScreen === "catalog" ? catalogContent() : sectionContent())
        : isHub
        ? hubContent()
        : isNested
          ? nestedContent()
          : isTimeline && activeSection === "overview"
        ? timelineContent()
        : isMap && activeSection === "overview"
          ? mapListContent()
          : isDashboard && activeSection === "overview"
            ? dashboardContent()
            : sectionContent();
      const navLabel = isHamburger
        ? (hamburgerScreen === "trips" ? "Мои путешествия" : hamburgerScreen === "catalog" ? "Каталог маршрутов" : section().label)
        : isHub
        ? (hubRoot === "today" ? "Сегодня" : hubRoot === "plan" ? "План" : hubRoot === "bookings" ? "Брони" : "Ещё")
        : isTimeline && activeSection === "overview"
          ? "Дни поездки"
        : isMap && activeSection === "overview"
          ? "План дня"
          : isDashboard && activeSection === "overview"
            ? "Сводка"
            : section().label;
      const topbar = isHamburger
        ? '<header class="topbar"><button class="hamburger-button" data-action="open-hamburger" aria-label="Открыть меню">☰</button><div class="hamburger-title"><small>' + (hamburgerScreen === "detail" ? "Рождественская Италия" : "Ramingo") + '</small><strong>' + navLabel + '</strong></div><span class="topbar-spacer"></span></header>'
        : '<header class="topbar"><button class="back" data-action="back">‹</button><button class="title-trigger ' + ((menuOpen || gridOpen || quickOpen) ? "open" : "") + '" data-action="open-menu"><small>Рождественская Италия</small><strong>' + navLabel + '<span class="chevron">⌄</span></strong></button><span class="topbar-spacer"></span></header>';
      return '<div class="status"><span>9:41</span><span>▰ ◔ ▰</span></div>' +
        topbar +
        (isNested ? nestedTabsMarkup() : isStrip ? stripMarkup() : "") +
        '<main class="content">' + mainContent + '</main>' +
        (isHub ? hubMarkup() : isGroups ? groupedMarkup() : '<div class="android-bar"><span>‹</span><span>○</span><span>□</span></div>') +
        (activeVariant === "baseline" ? menuMarkup() : "") +
        (showsGrid ? gridMarkup() : "") +
        (isQuick ? quickMarkup() : "") +
        (isHamburger ? hamburgerMarkup() : "");
    }

    function wire() {
      document.querySelectorAll("[data-section]").forEach(button => button.addEventListener("click", () => {
        activeSection = button.dataset.section;
        menuOpen = false;
        gridOpen = false;
        groupOpen = null;
        hubSheetOpen = false;
        quickOpen = false;
        hamburgerOpen = false;
        render();
      }));
      document.querySelectorAll("[data-action='open-menu']").forEach(button => button.addEventListener("click", () => {
        if (activeVariant === "baseline") menuOpen = !menuOpen;
        if (["grid", "timeline", "map", "dashboard"].includes(activeVariant)) gridOpen = !gridOpen;
        if (activeVariant === "quick") quickOpen = !quickOpen;
        render();
      }));
      document.querySelectorAll("[data-action='close-menu']").forEach(button => button.addEventListener("click", () => { menuOpen = false; render(); }));
      document.querySelectorAll("[data-action='close-grid']").forEach(button => button.addEventListener("click", () => { gridOpen = false; render(); }));
      document.querySelectorAll("[data-action='close-quick']").forEach(button => button.addEventListener("click", () => { quickOpen = false; render(); }));
      document.querySelectorAll("[data-action='open-hamburger']").forEach(button => button.addEventListener("click", () => { hamburgerOpen = !hamburgerOpen; render(); }));
      document.querySelectorAll("[data-action='close-hamburger']").forEach(button => button.addEventListener("click", () => { hamburgerOpen = false; render(); }));
      document.querySelectorAll("[data-action='toggle-global-nav']").forEach(button => button.addEventListener("click", () => { showGlobalNav = !showGlobalNav; render(); }));
      document.querySelectorAll("[data-action='open-trip']").forEach(button => button.addEventListener("click", () => {
        hamburgerScreen = "detail";
        activeSection = "overview";
        hamburgerOpen = false;
        render();
      }));
      document.querySelectorAll("[data-action='open-trips']").forEach(button => button.addEventListener("click", () => {
        hamburgerScreen = "trips";
        activeSection = "overview";
        hamburgerOpen = false;
        render();
      }));
      document.querySelectorAll("[data-action='open-catalog']").forEach(button => button.addEventListener("click", () => {
        hamburgerScreen = "catalog";
        hamburgerOpen = false;
        render();
      }));
      document.querySelectorAll("[data-group]").forEach(button => button.addEventListener("click", () => {
        groupOpen = groupOpen === button.dataset.group ? null : button.dataset.group;
        render();
      }));
      document.querySelectorAll("[data-action='back']").forEach(button => button.addEventListener("click", () => {
        activeSection = "overview";
        menuOpen = false;
        gridOpen = false;
        groupOpen = null;
        mapMode = "list";
        hubRoot = "today";
        hubSheetOpen = false;
        domain = "plan";
        quickOpen = false;
        hamburgerOpen = false;
        hamburgerScreen = "trips";
        render();
      }));
      document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => {
        mapMode = button.dataset.mode;
        render();
      }));
      document.querySelectorAll("[data-hub]").forEach(button => button.addEventListener("click", () => {
        hubRoot = button.dataset.hub;
        hubSheetOpen = hubRoot === "more";
        activeSection = "overview";
        render();
      }));
      document.querySelectorAll("[data-domain]").forEach(button => button.addEventListener("click", () => {
        domain = button.dataset.domain;
        activeSection = domain === "plan" ? "overview" : domain === "organize" ? "restaurants" : "members";
        render();
      }));
      document.querySelectorAll("[data-variant]").forEach(button => button.addEventListener("click", () => {
        activeVariant = button.dataset.variant;
        activeSection = "overview";
        menuOpen = false;
        gridOpen = false;
        groupOpen = null;
        hubRoot = "today";
        hubSheetOpen = false;
        domain = "plan";
        quickOpen = false;
        hamburgerOpen = false;
        render();
      }));
    }

    function render() {
      const variant = variants[activeVariant];
      document.getElementById("variantGrid").innerHTML = Object.entries(variants).map(([id, item]) =>
        '<button class="variant-card ' + (id === activeVariant ? "active" : "") + '" data-variant="' + id + '">' +
          '<span class="number">' + item.number + '</span><strong>' + item.title + '</strong><span>' + item.description + '</span>' +
        '</button>'
      ).join("");
      document.getElementById("notes").innerHTML =
        '<h2>' + variant.noteTitle + '</h2><p class="lead">' + variant.noteLead + '</p><ul class="note-list">' +
        variant.notes.map((item, index) => '<li><b>' + (index + 1) + '</b><div><strong>' + item[0] + '</strong><span>' + item[1] + '</span></div></li>').join("") +
        '</ul>';
      document.getElementById("soloControl").innerHTML = soloMode
        ? '<div><strong>Общая навигация внутри поездки</strong><small>Показывать «Мои путешествия»</small></div><button class="' + (showGlobalNav ? "" : "off") + '" data-action="toggle-global-nav">' + (showGlobalNav ? "Вкл" : "Выкл") + '</button>'
        : "";
      document.getElementById("phone").innerHTML = phoneMarkup();
      wire();
    }

    if (soloMode) {
      document.body.classList.add("solo-view");
      document.title = "Ramingo · hamburger-концепция";
    }
    render();
  </script>
</body>
</html>
