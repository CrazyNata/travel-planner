<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ramingo iOS — локальный предпросмотр</title>
  <style>
    @font-face{font-family:Manrope;src:url("../ios/Ramingo/Resources/Fonts/manrope_variable.ttf") format("truetype");font-weight:200 800}
    *{box-sizing:border-box} :root{--bg:#f4f4f7;--surface:#fff;--surface2:#f5f5f8;--track:#eeeef2;--text:#141419;--label:#3a3a42;--muted:#6a6a75;--border:#e6e6ec;--purple:#6c5ce7;--purple2:#8e7bf5;--tint:#f1eefe;--green:#22b07d;--red:#e0524b}
    body{margin:0;min-height:100vh;background:#e8e8ed;color:var(--text);font-family:Manrope,system-ui,sans-serif}
    button,input{font:inherit}.stage{min-height:100vh;display:grid;grid-template-columns:220px 414px;justify-content:center;align-items:start;gap:38px;padding:30px 24px 60px}
    .tools{position:sticky;top:30px}.tools h1{margin:0 0 6px;font-size:20px;font-weight:800}.tools p{margin:0 0 20px;color:#686873;font-size:12px;line-height:1.55}
    .tools button{display:flex;width:100%;align-items:center;gap:9px;margin:8px 0;border:1px solid #d9d9e0;border-radius:12px;background:#fff;padding:11px 13px;color:#30303a;font-size:13px;font-weight:750;cursor:pointer}.tools button.on{border-color:var(--purple);background:var(--purple);color:#fff}
    .device{position:relative;width:414px;height:868px;border:11px solid #151517;border-radius:60px;background:#151517;box-shadow:0 28px 80px #24243238}
    .phone{position:relative;width:392px;height:846px;overflow:hidden;border-radius:49px;background:var(--bg)}
    .island{position:absolute;z-index:20;top:10px;left:50%;width:116px;height:33px;transform:translateX(-50%);border-radius:20px;background:#050505}
    .status{position:absolute;z-index:19;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 27px 0 30px;font-size:13px;font-weight:800}.status span:last-child{letter-spacing:2px}
    .screen{position:absolute;inset:48px 0 0;overflow-y:auto;scrollbar-width:none;background:var(--bg)}.screen::-webkit-scrollbar{display:none}
    .pad{padding:0 18px 40px}.brandbar{height:54px;display:flex;align-items:center;justify-content:center;position:relative}.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800}.mark{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;font-size:13px;font-weight:800}.gear,.back,.edit{position:absolute;right:-7px;display:grid;place-items:center;width:48px;height:48px;border:0;background:transparent;font-size:23px}.back{left:-7px;right:auto;color:var(--purple);font-size:25px}.edit{font-size:19px}
    h2{margin:22px 0 0;font-size:32px;line-height:1.04;letter-spacing:-.03em;font-weight:800}.subtitle{margin:8px 0 0;color:var(--muted);font-size:14px;font-weight:600}
    .pills{display:flex;gap:9px;overflow:hidden;margin:18px 0}.pill{flex:none;border:1px solid var(--border);border-radius:22px;background:var(--surface);height:38px;padding:0 15px;color:var(--text);font-size:13px;font-weight:700}.pill.on{border-color:var(--purple);background:var(--purple);color:#fff;box-shadow:0 4px 10px #6c5ce738}
    .trip{overflow:hidden;margin:0 0 16px;border:1px solid var(--border);border-radius:22px;background:var(--surface);box-shadow:0 8px 26px #14142812}.photo{position:relative;height:178px;background:linear-gradient(145deg,#b8d2ee 0%,#d2b99f 42%,#53484f 100%)}.photo.rome{background:linear-gradient(#10101810,#10101855),url("https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=800&q=85") center/cover}.photo.paris{background:linear-gradient(#10101810,#10101855),url("https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=800&q=85") center/cover}
    .badge{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;border-radius:30px;background:#ffffffee;padding:7px 10px;color:#3a3a42;font-size:11px;font-weight:700}.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}.dots{position:absolute;top:12px;right:12px;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#ffffffef;font-size:18px;font-weight:800}.tripbody{padding:16px}.tripbody h3{margin:0 0 10px;font-size:20px;line-height:1.2;font-weight:800}.meta{display:flex;gap:7px;margin:7px 0;color:var(--muted);font-size:13px;font-weight:600}.progress{display:flex;align-items:center;gap:10px;margin-top:12px}.track{height:7px;flex:1;border-radius:10px;background:var(--track)}.track i{display:block;height:100%;width:68%;border-radius:10px;background:var(--purple)}.progress b{width:38px;color:var(--purple);font-size:12px;text-align:right}
    .new{display:flex;align-items:center;gap:13px;border:1px dashed #998eef;border-radius:20px;background:var(--surface);padding:15px}.plus{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;font-size:23px}.new b{display:block;font-size:16px}.new small{color:var(--muted);font-size:11px;font-weight:600}.arrow{margin-left:auto;color:var(--purple)}
    .auth{padding:40px 24px 34px}.authhead{display:flex;align-items:center}.authhead .brand{font-size:20px}.authhead .mark{width:42px;height:36px;border-radius:12px;font-size:19px}.lang{margin-left:auto;border:1px solid var(--border);border-radius:10px;background:var(--tint);padding:7px 8px;color:var(--text);font-size:12px;font-weight:800}.auth h2{margin-top:34px;font-size:30px}.fields{display:grid;gap:14px;margin-top:28px}.field label{display:block;margin:0 0 7px;color:var(--label);font-size:13px;font-weight:700}.field div{display:flex;align-items:center;height:52px;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:0 14px;color:#9999a4;font-size:15px;font-weight:600}.forgot{display:block;margin-top:10px;color:var(--purple);font-size:13px;font-weight:800}.remember{display:flex;align-items:center;gap:9px;margin-top:14px;color:var(--muted);font-size:13px;font-weight:700}.check{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--purple);color:#fff}.primary{display:grid;place-items:center;width:100%;height:56px;margin-top:18px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--purple),#7d6cf0);color:#fff;font-size:16px;font-weight:800}.or{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted);font-size:12px;font-weight:700}.or:before,.or:after{content:"";height:1px;flex:1;background:var(--border)}.google{display:grid;grid-template-columns:24px auto 24px;align-items:center;width:100%;height:53px;border:1px solid var(--border);border-radius:15px;background:var(--surface);font-size:15px;font-weight:800}.google i{color:#4285f4;font-size:18px;font-style:normal}.signup{text-align:center;margin-top:26px;color:var(--muted);font-size:14px;font-weight:600}.signup b{color:var(--purple)}
    .detailbar{height:54px;position:relative;display:flex;align-items:center;justify-content:center}.detailtitle{text-align:center}.detailtitle small{display:block;color:var(--muted);font-size:10px;font-weight:700}.detailtitle b{font-size:15px}.hero{position:relative;height:204px;border-radius:22px;background:linear-gradient(0deg,#000a,#0000 65%),url("https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=85") center/cover}.herotext{position:absolute;left:16px;right:16px;bottom:16px;color:#fff}.herotext h3{margin:0;font-size:24px;line-height:1.15}.herotext p{margin:4px 0 0;font-size:13px;font-weight:600}.tripstats{display:flex;align-items:center;margin:14px 0}.tripstats p{margin:0;font-size:13px;font-weight:700}.tripstats small{display:block;color:var(--muted);font-size:11px}.tripstats b{margin-left:auto;color:var(--purple);font-size:18px}.sections{display:flex;gap:9px;overflow:hidden;margin:18px 0}.section{flex:none;height:38px;border:1px solid var(--border);border-radius:22px;background:var(--tint);padding:0 13px;font-size:12px;font-weight:700}.section.on{border-color:var(--purple);background:var(--purple);color:#fff}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:13px}.tile i{color:var(--purple);font-style:normal}.tile b{display:block;margin-top:8px;font-size:20px}.tile small{color:var(--muted);font-size:11px}.sectiontitle{margin:22px 0 10px;font-size:19px}.weather{display:flex;gap:10px}.weather .tile{min-width:138px;background:var(--tint)}
    .sheet{padding:14px 18px 40px}.handle{width:38px;height:5px;margin:0 auto 14px;border-radius:5px;background:#c8c8cf}.sheet h2{margin:0;text-align:center;font-size:18px}.profile{display:flex;align-items:center;gap:15px;margin-top:20px;border:1px solid var(--border);border-radius:22px;background:var(--surface);padding:18px;box-shadow:0 8px 26px #14142810}.avatar{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#8e7bf5,#6c5ce7);color:#fff;font-size:20px;font-weight:800}.profile h3{margin:0;font-size:18px}.profile p{margin:4px 0;color:var(--muted);font-size:12px}.profile a{color:var(--purple);font-size:12px;font-weight:800}.eyebrow{margin:20px 4px 10px;color:var(--purple);font-size:11px;font-weight:800;letter-spacing:1.1px}.group{border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:0 15px}.row{display:flex;align-items:center;min-height:52px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700}.row:last-child{border:0}.ico{width:34px;color:var(--purple)}.value{margin-left:auto;color:var(--muted);font-size:12px}.toggle{margin-left:auto;width:44px;height:26px;border-radius:20px;background:var(--purple);padding:3px}.toggle:after{content:"";display:block;width:20px;height:20px;margin-left:18px;border-radius:50%;background:#fff}
    .create{padding:28px 24px}.create h2{margin:0;font-size:30px}.dategrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.5}
    @media(max-width:760px){.stage{display:block;padding:14px}.tools{position:static;width:392px;max-width:100%;margin:0 auto 18px}.tools p{display:none}.tools nav{display:flex;overflow:auto;gap:6px}.tools button{width:auto;white-space:nowrap;margin:0}.device{margin:auto;transform-origin:top center}}
    @media(max-width:440px){.device{transform:scale(.91);margin-bottom:-78px}}
  </style>
</head>
<body>
  <main class="stage">
    <aside class="tools">
      <h1>Ramingo iOS</h1>
      <p>Локальное визуальное зеркало SwiftUI-клиента. Размеры, палитра, шрифт и компоненты совпадают с Android.</p>
      <nav>
        <button data-view="home" class="on">⌂ Мои поездки</button>
        <button data-view="auth">↪ Вход</button>
        <button data-view="trip">✈ Поездка</button>
        <button data-view="settings">⚙ Настройки</button>
        <button data-view="create">＋ Создание</button>
      </nav>
    </aside>
    <div class="device">
      <div class="phone">
        <div class="island"></div>
        <div class="status"><span>9:41</span><span>▮▮▮ ))) ▰</span></div>
        <section id="screen" class="screen"></section>
      </div>
    </div>
  </main>
  <template id="home">
    <div class="pad">
      <div class="brandbar"><div class="brand"><span class="mark">R</span>Ramingo</div><button class="gear">⚙</button></div>
      <h2>Мои путешествия</h2>
      <div class="pills"><button class="pill on">Все · 2</button><button class="pill">Предстоящие · 1</button><button class="pill">Черновики · 1</button></div>
      <article class="trip"><div class="photo rome"><span class="badge"><i class="dot"></i>Предстоит</span><span class="dots">···</span></div><div class="tripbody"><h3>Рождественская Италия</h3><div class="meta">▣ 19–27 декабря 2026</div><div class="meta">⌖ Рим · Флоренция · Милан</div><div class="progress"><span class="track"><i></i></span><b>68%</b></div></div></article>
      <article class="trip"><div class="photo paris"><span class="badge"><i class="dot" style="background:#f5a623"></i>Черновик</span><span class="dots">···</span></div><div class="tripbody"><h3>Весенний Париж</h3><div class="meta">▣ Даты не указаны</div><div class="meta">⌖ Париж</div><div class="progress"><span class="track"><i style="width:24%"></i></span><b>24%</b></div></div></article>
      <div class="new"><span class="plus">＋</span><span><b>Новое путешествие</b><small>Добавить маршрут, места и жильё</small></span><span class="arrow">›</span></div>
    </div>
  </template>
  <template id="auth">
    <div class="auth">
      <div class="authhead"><div class="brand"><span class="mark">R</span>Ramingo</div><button class="lang">◎ RU⌄</button></div>
      <h2>С возвращением</h2><p class="subtitle">Войдите, чтобы продолжить планирование</p>
      <div class="fields"><div class="field"><label>E-mail</label><div>you@example.com</div></div><div class="field"><label>Пароль</label><div>•••••••• <span style="margin-left:auto">◉</span></div></div></div>
      <span class="forgot">Забыли пароль?</span><div class="remember"><span class="check">✓</span>Запомнить данные входа</div>
      <button class="primary">Войти</button><div class="or">или</div><button class="google"><i>G</i><span>Продолжить с Google</span></button><div class="signup">Нет аккаунта?<b> Зарегистрироваться</b></div>
    </div>
  </template>
  <template id="trip">
    <div class="pad">
      <div class="detailbar"><button class="back">‹</button><div class="detailtitle"><small>Рождественская Италия</small><b>Обзор⌄</b></div><button class="edit">✎</button></div>
      <div class="hero"><div class="herotext"><h3>Рождественская Италия</h3><p>Рим · Флоренция · Милан</p></div></div>
      <div class="tripstats"><p>19–27 декабря 2026<small>Предстоит · Владелец</small></p><b>68%</b></div><div class="track"><i style="width:68%"></i></div>
      <div class="sections"><button class="section on">✦ Обзор</button><button class="section">⌁ Маршрут</button><button class="section">⌂ Места</button></div>
      <div class="tiles"><div class="tile"><i>⌖</i><b>3</b><small>города</small></div><div class="tile"><i>↝</i><b>2</b><small>переезда</small></div><div class="tile"><i>⌂</i><b>14</b><small>мест</small></div></div>
      <h3 class="sectiontitle">Погода</h3><div class="weather"><div class="tile"><small>Рим</small><b>12°</b><small>Солнечно</small></div><div class="tile"><small>Флоренция</small><b>9°</b><small>Облачно</small></div></div>
      <h3 class="sectiontitle">Карта маршрута</h3><div style="height:170px;border-radius:20px;background:linear-gradient(35deg,#dce7d4,#d9e6ef);display:grid;place-items:center;color:var(--purple);font-size:38px">⌖ ··· ⌖ ··· ⌖</div>
    </div>
  </template>
  <template id="settings">
    <div class="sheet"><div class="handle"></div><h2>Профиль и настройки</h2><div class="profile"><div class="avatar">НП</div><div><h3>Наташа</h3><p>natasha7261@gmail.com</p><a>Изменить фото</a></div></div>
      <div class="eyebrow">НАПОМИНАНИЯ</div><div class="group"><div class="row"><span class="ico">♢</span>Разрешить уведомления<span class="toggle"></span></div><div class="row"><span class="ico">✈</span>Напоминать о поездках<span class="toggle"></span></div><div class="row"><span class="ico">▱</span>Напоминать об отмене жилья<span class="toggle"></span></div><div class="row"><span class="ico">◷</span>Время напоминаний<span class="value">09:00</span></div></div>
      <div class="eyebrow">ПРИЛОЖЕНИЕ</div><div class="group"><div class="row"><span class="ico">◎</span>Язык<span class="value">Русский ›</span></div><div class="row"><span class="ico">◐</span>Тёмная тема<span class="toggle" style="background:#d3d3da"><span></span></span></div><div class="row"><span class="ico">ⓘ</span>Версия<span class="value">iOS 0.1.0</span></div></div><button class="primary">Сохранить настройки</button>
    </div>
  </template>
  <template id="create">
    <div class="create"><button class="back">‹</button><h2 style="padding-top:48px">Новое путешествие</h2><p class="subtitle">Добавьте основу — детали можно заполнить позже</p><div class="fields"><div class="field"><label>Название</label><div>Рождественская Италия</div></div><div class="field"><label>Города</label><div>Рим, Флоренция, Милан</div></div></div><div class="eyebrow" style="margin-left:0">ДАТЫ</div><div class="dategrid"><div class="field"><label>Начало</label><div>2026-12-19</div></div><div class="field"><label>Окончание</label><div>2026-12-27</div></div></div><button class="primary" style="margin-top:24px">Создать путешествие</button><p class="note">После создания откроются маршрут, места, жильё, бюджет и остальные разделы.</p></div>
  </template>
  <script>
    const screen=document.querySelector("#screen");
    function show(id){screen.innerHTML=document.querySelector("#"+id).innerHTML;screen.scrollTop=0;document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view===id))}
    document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>show(b.dataset.view));show("home");
  </script>
</body>
</html>
