  function drawMap(el,pointsOverride){
    const points=pointsOverride||mapPoints[el.dataset.map]||[];
    if(el._previewMap){el._previewMap.remove();maps=maps.filter(item=>item!==el._previewMap);el._previewMap=null}
    if(!window.L){el.innerHTML='<div style="height:100%;display:grid;place-items:center;color:#777">Карта временно недоступна</div>';return}
    const map=L.map(el,{zoomControl:false,scrollWheelZoom:false,attributionControl:true});el._previewMap=map;maps.push(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    const line=L.polyline(points,{color:'#6c5ce7',weight:5,opacity:.95,lineJoin:'round'}).addTo(map);
    points.forEach((point,index)=>{
      const marker=L.marker(point,{icon:L.divIcon({className:'',html:`<div class="numbered-pin">${index+1}</div>`,iconSize:[25,25],iconAnchor:[12,12]})}).addTo(map);
      marker.on('click',()=>showNotice(`Точка маршрута ${index+1} открыта`));
    });
    el.querySelectorAll('.numbered-pin').forEach(pin=>pin.onclick=event=>{event.stopPropagation();showNotice(`Точка маршрута ${pin.textContent} открыта`)});
    map.fitBounds(line.getBounds(),{padding:[20,20]});
    setTimeout(()=>map.invalidateSize(),0);
  }
  function redrawMap(el,points){

  function parseTripDate(value){
    const months=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
    const match=String(value||'').match(/(\d{1,2})\s+([а-яё]+)\s+(\d{4})\s+[–-]\s+(\d{1,2})\s+([а-яё]+)\s+(\d{4})/i);
    if(!match)return{start:new Date(Date.UTC(2026,8,14)),end:new Date(Date.UTC(2026,8,16))};
    const startMonth=Math.max(0,months.indexOf(match[2].toLowerCase().slice(0,3)));
    const endMonth=Math.max(0,months.indexOf(match[5].toLowerCase().slice(0,3)));
    return{start:new Date(Date.UTC(Number(match[3]),startMonth,Number(match[1]))),end:new Date(Date.UTC(Number(match[6]),endMonth,Number(match[4])))};
  }
  function formatTripDate(start,end){
    const months=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
    const days=Math.max(1,Math.round((end-start)/86400000)+1);
    const dayWord=days===1?'день':days>=2&&days<=4?'дня':'дней';
    return start.getUTCFullYear()===end.getUTCFullYear()&&start.getUTCMonth()===end.getUTCMonth()
      ? start.getUTCDate()+' '+months[start.getUTCMonth()]+' '+start.getUTCFullYear()+' – '+end.getUTCDate()+' '+months[end.getUTCMonth()]+' '+end.getUTCFullYear()+' · '+days+' '+dayWord
      : start.getUTCDate()+' '+months[start.getUTCMonth()]+' '+start.getUTCFullYear()+' – '+end.getUTCDate()+' '+months[end.getUTCMonth()]+' '+end.getUTCFullYear()+' · '+days+' '+dayWord;
  }

    picker.querySelector('[data-trip-date-close]').onclick=close;picker.querySelector('[data-trip-date-cancel]').onclick=close;

  function bindPetsActions(){

  }
  function bindBudgetActions(){
    if(!screen.querySelector('.currency'))return;
    const symbols=['₽','€','Kč','$','£','zł','Fr','Ft'];
    const codes=['RUB','EUR','CZK','USD','GBP','PLN','CHF','HUF'];
    const baseValues={total:5641.04,person:1410.26,day:313.39,categories:[1491.04,950,0,0,3200]};
    const multiplierFor=()=>({
      '₽':previewBudgetRate,
      '€':1,
      'Kč':25,
      '$':100/90,
      '£':100/115,
      'zł':4,
      'Fr':100/105,
      'Ft':400
    }[previewBudgetCurrency]||1);
    const formatValue=value=>{const rounded=Math.round(value*100)/100;return rounded.toLocaleString('ru-RU',{minimumFractionDigits:Number.isInteger(rounded)?0:2,maximumFractionDigits:2}).replace(/\u00a0/g,' ')};
    const update=()=>{
      const multiplier=multiplierFor();
      screen.querySelector('.sum b').textContent=`${previewBudgetCurrency} ${formatValue(baseValues.total*multiplier)}`;
      screen.querySelectorAll('.metric b').forEach((item,index)=>item.textContent=`${previewBudgetCurrency} ${formatValue((index?baseValues.day:baseValues.person)*multiplier)}`);
      screen.querySelectorAll('.cat em').forEach((item,index)=>item.textContent=`${previewBudgetCurrency} ${formatValue(baseValues.categories[index]*multiplier)}`);
      const rubPerUnit=previewBudgetCurrency==='₽'?1:previewBudgetRate/multiplier;
      const code=codes[symbols.indexOf(previewBudgetCurrency)]||'EUR';
      const heading=screen.querySelector('.rate h3');if(heading)heading.textContent=`1 ${code} = ${formatValue(rubPerUnit)} ₽`;
      const note=screen.querySelector('.rate .row:last-child small');if(note)note.textContent=`за 1 ${code} · Задано вручную`;
      screen.querySelectorAll('.currency span').forEach(item=>item.classList.toggle('on',item.textContent.trim()===previewBudgetCurrency));
    };
    screen.querySelectorAll('.currency span').forEach((item,index)=>{const symbol=symbols[index];makeInteractive(item,`Выбрать валюту ${symbol}`);item.onclick=()=>{previewBudgetCurrency=symbol;update();showNotice(`Валюта: ${symbol}`)}});update();
    const change=screen.querySelector('.rate .row span b');if(change){makeInteractive(change,'Изменить курс валюты');change.onclick=()=>openPreviewDialog({title:'Изменить курс',detail:'Задайте курс EUR для расчёта бюджета.',label:'Курс',value:String(previewBudgetRate),type:'number',placeholder:'50',submit:(value,error,close)=>{const rate=Number(value.replace(',','.'));if(!Number.isFinite(rate)||rate<=0){error.textContent='Введите положительное число';return}previewBudgetRate=rate;update();close();showNotice('Курс валюты обновлён')}})}
    const refresh=screen.querySelector('.rate button');if(refresh)refresh.onclick=()=>{refresh.textContent='✓ Обновлено';showNotice('Курс валюты обновлён');setTimeout(()=>{if(refresh.isConnected)refresh.textContent='↻ Обновить'},1400)};
  }
  function bindMembersActions(){
    const edit=screen.querySelector('.memberhead button');if(edit){edit.onclick=()=>{const enabled=edit.dataset.editing==='true';edit.dataset.editing=String(!enabled);edit.textContent=enabled?'✎ Изменить':'Готово';screen.querySelectorAll('.member').forEach(card=>card.style.outline=enabled?'':'2px solid #d8d3ff');showNotice(enabled?'Редактирование завершено':'Режим редактирования участников включён')}}
    const invite=screen.querySelector('.memberhead')?.parentElement.querySelector('.dashed');if(invite){makeInteractive(invite,'Пригласить участника');invite.onclick=()=>openPreviewDialog({title:'Пригласить участника',detail:'Укажите e-mail участника поездки.',label:'E-mail',type:'email',placeholder:'name@example.com',submit:(value,error,close)=>{if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)){error.textContent='Укажите корректный e-mail';return}const name=value.split('@')[0].replace(/[._-]+/g,' ');const card=document.createElement('div');card.className='card member row';card.innerHTML='<span class="avatar"></span><span><b></b><small></small></span><span class="role green">Редактор</span>';card.querySelector('.avatar').textContent=name.slice(0,1).toUpperCase();card.querySelector('b').textContent=name;card.querySelector('small').textContent=value;invite.before(card);close();showNotice(`Приглашение отправлено на ${value}`)}})}
  }
  function bindPhotosActions(){
    const upload=screen.querySelector('.photo-head button');const grid=screen.querySelector('.photo-grid');if(!upload||!grid)return;
    const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=true;input.hidden=true;screen.append(input);upload.onclick=()=>input.click();upload.setAttribute('aria-label','Загрузить фотографии');
    input.onchange=()=>{const files=Array.from(input.files||[]);if(!files.length)return;files.forEach(file=>{const reader=new FileReader();reader.onload=()=>{const image=document.createElement('img');image.src=String(reader.result||'');image.alt=file.name;grid.append(image);makeInteractive(image,`Открыть ${file.name}`);image.onclick=()=>showNotice(`Фото «${file.name}» открыто`)};reader.readAsDataURL(file)});showNotice(`Добавлено фото: ${files.length}`)};
    grid.querySelectorAll('img').forEach((image,index)=>{makeInteractive(image,`Открыть фото ${index+1}`);image.onclick=()=>showNotice(`Фото ${index+1} открыто`)});
  }
  function bindCommonActions(){
    screen.querySelectorAll('.topedit').forEach(button=>{makeInteractive(button,'Редактировать путешествие');button.onclick=()=>showNotice('Редактирование путешествия открыто')});
    screen.querySelectorAll('.drawer').forEach(drawer=>drawer.onclick=event=>{if(event.target===drawer)show(previewDrawerReturn)});
    screen.querySelectorAll('.arr').forEach(button=>{const right=button.classList.contains('r');makeInteractive(button,right?'Следующий город':'Предыдущий город');button.onclick=()=>{previewHeroIndex=(previewHeroIndex+(right?1:-1)+heroSlides.length)%heroSlides.length;const slide=heroSlides[previewHeroIndex];const hero=button.closest('.hero');hero.style.backgroundImage=slide.image;hero.querySelector('strong').textContent=slide.title;showNotice(`Город: ${slide.title}`)}});
    bindTrips();bindRouteActions();bindSightActions();bindRestaurants();bindLocations();bindHotelActions();bindPetsActions();bindBudgetActions();bindMembersActions();bindPhotosActions();
  }
  function bindSettings(){
    const themeTitles={system:'Системная',light:'Светлая',dark:'Тёмная'};
    const languageTitles={RU:'Русский',EN:'English',ES:'Español',DE:'Deutsch'};
    applyPreviewTheme();
    screen.querySelector('[data-settings-current="theme"]')?.replaceChildren(document.createTextNode(themeTitles[previewTheme]));
    screen.querySelector('[data-settings-current="language"]')?.replaceChildren(document.createTextNode(languageTitles[previewLanguage]));
    screen.querySelectorAll('[data-settings-choice="theme"]').forEach(item=>item.classList.toggle('on',item.dataset.value===previewTheme));
    screen.querySelectorAll('[data-settings-choice="language"]').forEach(item=>item.classList.toggle('on',item.dataset.value===previewLanguage));
    screen.querySelectorAll('[data-settings-toggle]').forEach(button=>button.onclick=()=>{
      const options=button.parentElement.querySelector(`[data-settings-options="${button.dataset.settingsToggle}"]`);
      if(options)options.classList.toggle('open');
    });
    screen.querySelectorAll('[data-settings-choice]').forEach(choice=>choice.onclick=()=>{
      const key=choice.dataset.settingsChoice;
      const options=choice.closest('[data-settings-options]');
      const group=choice.closest('.settings-group');
      if(key==='theme')previewTheme=choice.dataset.value;
      if(key==='language')previewLanguage=choice.dataset.value;
      options?.querySelectorAll('[data-settings-choice]').forEach(item=>item.classList.toggle('on',item===choice));
      group?.querySelector(`[data-settings-current="${key}"]`)?.replaceChildren(document.createTextNode(choice.textContent));
      options?.classList.remove('open');
      applyPreviewTheme();
    });
    const photoInput=document.createElement('input');
    photoInput.type='file';photoInput.accept='image/*';photoInput.hidden=true;
    photoInput.onchange=()=>{
      const file=photoInput.files?.[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{
        previewAvatarDataUrl=String(reader.result||'');
        const avatar=screen.querySelector('.settings-avatar');
        if(avatar&&previewAvatarDataUrl){avatar.textContent='';avatar.style.backgroundImage=`url("${previewAvatarDataUrl}")`;avatar.style.backgroundSize='cover';avatar.style.backgroundPosition='center';}
        showNotice('Фото профиля обновлено');
      };
      reader.readAsDataURL(file);
    };
    screen.append(photoInput);
    const avatar=screen.querySelector('.settings-avatar');
    if(avatar&&previewAvatarDataUrl){avatar.textContent='';avatar.style.backgroundImage=`url("${previewAvatarDataUrl}")`;avatar.style.backgroundSize='cover';avatar.style.backgroundPosition='center';}
    const targets={'Уведомления':'notifications','Сменить пароль':'password','Сменить фото':'photo'};
    screen.querySelectorAll('.settings-row').forEach(row=>{
      const title=row.querySelector('.settings-row-main b')?.textContent.trim();
      const target=title&&targets[title];
      if(!target)return;
      row.onclick=()=>target==='photo'?photoInput.click():show(target);
    });
    const simpleActions={
      'Удалить аккаунт':()=>showNotice('Удаление аккаунта отключено в локальном превью'),
      'Отправить отзыв':()=>openPreviewDialog({title:'Отправить отзыв',detail:'Сообщение отправится только в тестовом режиме.',label:'Ваш отзыв',placeholder:'Напишите, что улучшить',submit:(value,error,close)=>{if(!value){error.textContent='Введите отзыв';return}close();showNotice('Спасибо, отзыв сохранён для теста')}}),
      'Показать обучение':()=>showNotice('Обучение открыто'),
      'Оценить Ramingo':()=>showNotice('Экран оценки открыт'),
    };
    screen.querySelectorAll('.settings-row').forEach(row=>{
      const title=row.querySelector('.settings-row-main b')?.textContent.trim();
      if(simpleActions[title])row.onclick=simpleActions[title];
    });
    screen.querySelector('.settings-logout')?.addEventListener('click',()=>{show('trips');setTimeout(()=>showNotice('Выход из аккаунта выполнен в превью'),0)});
    const notificationRow=Array.from(screen.querySelectorAll('.settings-row')).find(row=>row.querySelector('.settings-row-main b')?.textContent.trim()==='Уведомления');
    notificationRow?.querySelector('.settings-row-value')?.replaceChildren(document.createTextNode(previewNotificationsEnabled?'Включены':'Выключены'));
  }
  function bindNotifications(){
    const master=screen.querySelector('.notification-toggle');
    if(!master)return;
    const trip=screen.querySelector('[data-notification-kind="trip"]');
    const cancellation=screen.querySelector('[data-notification-kind="cancellation"]');
    const payment=screen.querySelector('[data-notification-kind="payment"]');
    const email=screen.querySelector('[data-notification-kind="email"]');
    const emailPayment=screen.querySelector('[data-notification-kind="email-payment"]');
    const hour=screen.querySelector('[data-notification-hour]');
    const status=screen.querySelector('[data-notification-status]');
    const permission=screen.querySelector('[data-notification-permission]');
    const permissionText=screen.querySelector('[data-notification-permission-text]');
    const permissionDetail=screen.querySelector('[data-notification-permission-detail]');
    const emailTarget=screen.querySelector('[data-notification-email-target]');
    const message=screen.querySelector('[data-notification-message]');
    const modal=screen.querySelector('[data-notification-modal]');
    const dialog=screen.querySelector('[data-notification-dialog]');
    const dialogTitle=screen.querySelector('[data-notification-dialog-title]');
    const dialogDetail=screen.querySelector('[data-notification-dialog-detail]');
    const emailField=screen.querySelector('[data-notification-email-field]');
    const emailInput=screen.querySelector('[data-notification-email-input]');
    const timeField=screen.querySelector('[data-notification-time-field]');
    const timeInput=screen.querySelector('[data-notification-time-input]');
    const modalError=screen.querySelector('[data-notification-dialog-error]');
    master.checked=previewNotificationsEnabled;
    if(trip)trip.checked=previewTripReminders;
    if(cancellation)cancellation.checked=previewCancellationReminders;
    if(payment)payment.checked=previewPaymentReminders;
    if(email)email.checked=previewEmailNotifications;
    if(emailPayment)emailPayment.checked=previewEmailPaymentReminders;
    if(hour)hour.textContent=previewReminderHour;
    if(emailTarget)emailTarget.textContent=previewEmailRecipient;
    const update=()=>{
      previewNotificationsEnabled=master.checked;
      if(trip)previewTripReminders=trip.checked;
      if(cancellation)previewCancellationReminders=cancellation.checked;
      if(payment)previewPaymentReminders=payment.checked;
      if(email)previewEmailNotifications=email.checked;
      if(emailPayment)previewEmailPaymentReminders=emailPayment.checked;
      [trip,cancellation,payment].forEach(input=>{if(input){input.disabled=!master.checked;input.closest('.notification-toggle-row').classList.toggle('disabled',!master.checked);}});
      if(emailPayment){emailPayment.disabled=!email.checked;emailPayment.closest('.notification-toggle-row').classList.toggle('disabled',!email.checked);}
      if(status)status.textContent=master.checked?'Включены':'Выключены';
      if(permission){
        permission.classList.toggle('off',!previewPhonePermissionGranted);
        if(permissionText)permissionText.textContent=previewPhonePermissionGranted?'Разрешение телефона включено':'Разрешите уведомления телефона';
        if(permissionDetail)permissionDetail.textContent=previewPhonePermissionGranted?'Ramingo сможет напоминать о важных датах.':'Нажмите, чтобы открыть системное разрешение.';
        permission.querySelector('svg')?.setAttribute('data-lucide',previewPhonePermissionGranted?'check':'bell');
      }
      refreshIcons();
    };
    let modalMode='';
    const closeModal=()=>{if(modal)modal.hidden=true;if(modalError)modalError.textContent='';};
    const openModal=(mode)=>{
      modalMode=mode;
      if(!modal)return;
      if(dialogTitle)dialogTitle.textContent=mode==='email'?'Почта для писем':'Время отправки';
      if(dialogDetail)dialogDetail.textContent=mode==='email'?'Укажите адрес, на который будут приходить напоминания Ramingo.':'Выберите час, в который будут приходить ежедневные напоминания.';
      if(emailField)emailField.hidden=mode!=='email';
      if(timeField)timeField.hidden=mode!=='time';
      if(emailInput)emailInput.value=previewEmailRecipient;
      if(timeInput)timeInput.value=previewReminderHour;
      if(modalError)modalError.textContent='';
      modal.hidden=false;
      (mode==='email'?emailInput:timeInput)?.focus();
    };
    dialog?.addEventListener('submit',event=>{
      event.preventDefault();
      if(modalMode==='email'){
        const value=String(emailInput?.value||'').trim().toLowerCase();
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)){if(modalError)modalError.textContent='Укажите корректный e-mail';return;}
        previewEmailRecipient=value;
        if(emailTarget)emailTarget.textContent=value;
      }else{
        const value=String(timeInput?.value||'').trim();
        if(!/^(?:[01]\d|2[0-3]):00$/.test(value)){if(modalError)modalError.textContent='Выберите время с минутами :00';return;}
        previewReminderHour=value;
        if(hour)hour.textContent=value;
      }
      if(message){message.classList.remove('error');message.textContent='';}
      closeModal();
    });
    modal?.addEventListener('click',event=>{if(event.target===modal)closeModal();});
    screen.querySelectorAll('[data-notification-modal-close],[data-notification-modal-cancel]').forEach(button=>button.onclick=closeModal);
    master.onchange=update;trip?.addEventListener('change',update);cancellation?.addEventListener('change',update);payment?.addEventListener('change',update);email?.addEventListener('change',update);emailPayment?.addEventListener('change',update);
    screen.querySelector('[data-notification-time]')?.addEventListener('click',()=>openModal('time'));
    screen.querySelectorAll('[data-notification-preset]').forEach(button=>button.onclick=()=>{
      const index=Number(button.dataset.notificationPreset);
      screen.querySelectorAll('[data-notification-preset]').forEach(item=>item.classList.toggle('on',item===button));
      master.checked=true;
      if(index===1){trip.checked=false;cancellation.checked=true;payment.checked=true}
      else{trip.checked=true;cancellation.checked=true;payment.checked=true}
      update();
    });
    screen.querySelector('[data-notification-permission]')?.addEventListener('click',()=>{
      previewPhonePermissionGranted=true;
      update();
    });
    screen.querySelector('[data-notification-email-edit]')?.addEventListener('click',()=>openModal('email'));
    screen.querySelector('[data-notification-help]')?.addEventListener('click',()=>showNotice('Ramingo напомнит о начале поездки, оплате жилья и дедлайнах бесплатной отмены.'));
    screen.querySelector('[data-notification-save]')?.addEventListener('click',()=>{update();if(message){message.classList.remove('error');message.textContent='Настройки сохранены';}});
    update();
  }
  function bindPassword(){
    const save=screen.querySelector('[data-password-save]');
    if(!save)return;
    const password=screen.querySelector('[data-password="new"]');
    const repeat=screen.querySelector('[data-password="repeat"]');
    const message=screen.querySelector('[data-password-message]');
    save.onclick=()=>{
      const value=password?.value||'';const repeated=repeat?.value||'';
      if(value.length<6){if(message){message.classList.add('error');message.textContent='Пароль должен содержать минимум 6 символов';}return;}
      if(value!==repeated){if(message){message.classList.add('error');message.textContent='Пароли не совпадают';}return;}
      if(message){message.classList.remove('error');message.textContent='Пароль изменён';}
      save.textContent='Сохранено';save.disabled=true;
    };
  }
  function show(id){
    if(id==='drawer')previewDrawerReturn=previewCurrentView;
    document.querySelector('[data-trip-editor]')?.remove();
    document.querySelector('[data-trip-date-picker]')?.remove();
    previewTripEditorCard=null;
    maps.forEach(map=>map.remove());maps=[];
    screen.innerHTML=document.querySelector('#'+id).innerHTML;screen.scrollTop=0;
    previewCurrentView=id;
    const activeView=['settings','notifications','password'].includes(id)?'trips':id;
    document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===activeView));
    screen.querySelectorAll('.hamb').forEach(b=>b.onclick=()=>show('drawer'));
    screen.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(b.dataset.open));
    refreshIcons();bindWeather();bindFilters();bindPets();bindCopies();bindTripFilters();bindSettings();bindNotifications();bindPassword();
    screen.querySelectorAll('[data-map]').forEach(drawMap);
    bindCommonActions();
  }
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));show('overview');
</script>
