<script>
  const screen=document.querySelector('#screen');
  let maps=[];
  let previewTheme='light';
  let previewLanguage='RU';
  let previewNotificationsEnabled=false;
  let previewTripReminders=true;
  let previewCancellationReminders=true;
  let previewPaymentReminders=true;
  let previewEmailNotifications=true;
  let previewEmailPaymentReminders=true;
  let previewEmailRecipient='timur.munykin@gmail.com';
  let previewReminderHour='09:00';
  let previewPhonePermissionGranted=false;
  let previewAvatarDataUrl='';
  const mapPoints={
    overview:[[50.0755,14.4378],[47.763,12.751],[45.4384,10.9916],[41.9028,12.4964],[43.7228,10.4017],[43.7696,11.2558],[45.4408,12.3155],[45.4642,9.19],[47.8095,13.055],[48.1351,11.582]],
    sights:[[45.4387,10.9927],[45.442,10.9987],[45.4439,10.9989],[45.4474,11.0001],[45.446,10.997],[45.4485,11.0007],[45.441,10.9876]],
    restaurants:[[51.5072,-0.1276],[48.8566,2.3522],[48.2082,16.3738],[47.8095,13.055],[45.4384,10.9916],[45.4408,12.3155],[43.7696,11.2558],[41.9028,12.4964]]
  };
  function drawMap(el){
    const points=mapPoints[el.dataset.map]||[];
    if(!window.L){el.innerHTML='<div style="height:100%;display:grid;place-items:center;color:#777">Карта временно недоступна</div>';return}
    const map=L.map(el,{zoomControl:false,scrollWheelZoom:false,attributionControl:true});maps.push(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    const line=L.polyline(points,{color:'#6c5ce7',weight:5,opacity:.95,lineJoin:'round'}).addTo(map);
    points.forEach((point,index)=>L.marker(point,{icon:L.divIcon({className:'',html:`<div class="numbered-pin">${index+1}</div>`,iconSize:[25,25],iconAnchor:[12,12]})}).addTo(map));
    map.fitBounds(line.getBounds(),{padding:[20,20]});
    setTimeout(()=>map.invalidateSize(),0);
  }
  function refreshIcons(){if(window.lucide)lucide.createIcons({attrs:{'stroke-width':2}})}
  function bindWeather(){
    screen.querySelectorAll('[data-weather]').forEach(button=>button.onclick=()=>{
      const trip=button.dataset.weather==='trip';
      screen.querySelectorAll('[data-weather]').forEach(item=>item.classList.toggle('on',item===button));
      screen.querySelector('[data-weather-sub]').textContent=trip?'Прогноз на даты поездки':'Текущая погода для городов маршрута';
      screen.querySelectorAll('.weather-card').forEach(card=>{const [temp,condition]=(trip?card.dataset.trip:card.dataset.now).split('|');card.querySelector('strong').textContent=temp;card.querySelector('small').textContent=condition});
    });
  }
  function bindFilters(){
    screen.querySelectorAll('.filter').forEach(button=>button.onclick=()=>button.closest('.content').querySelector('.filter-panel')?.classList.toggle('open'));
    screen.querySelectorAll('.filter-option').forEach(option=>option.onclick=()=>{option.classList.toggle('on');const content=option.closest('.content');content.querySelector('.filterbadge').textContent=content.querySelectorAll('.filter-option.on').length});
    screen.querySelectorAll('.chip').forEach(chip=>chip.onclick=()=>{chip.parentElement.querySelectorAll('.chip').forEach(item=>item.classList.remove('on'));chip.classList.add('on')});
  }
  function bindPets(){
    const update=()=>{const type=screen.querySelector('[data-pet-type].on')?.dataset.petType||'shop';const query=(screen.querySelector('.search input')?.value||'').toLowerCase();let visible=0;screen.querySelectorAll('[data-pet]').forEach(card=>{const show=card.dataset.pet===type&&card.textContent.toLowerCase().includes(query);card.style.display=show?'block':'none';if(show)visible++});const empty=screen.querySelector('.empty-pets');if(empty)empty.style.display=visible?'none':'block'};
    screen.querySelectorAll('[data-pet-type]').forEach(button=>button.onclick=()=>{screen.querySelectorAll('[data-pet-type]').forEach(item=>item.classList.toggle('on',item===button));update()});
    const input=screen.querySelector('.search input');if(input)input.oninput=update;
  }
  function bindCopies(){
    screen.querySelectorAll('.copy-route').forEach(button=>button.onclick=()=>{button.querySelector('span').textContent='Скопировано';button.querySelector('i')?.setAttribute('data-lucide','check');refreshIcons();setTimeout(()=>{if(!button.isConnected)return;button.querySelector('span').textContent='Копировать';button.querySelector('svg')?.setAttribute('data-lucide','copy');refreshIcons()},1300)});
    screen.querySelectorAll('.copy-leg').forEach(button=>button.onclick=()=>{button.innerHTML='<i data-lucide="check"></i>';refreshIcons();setTimeout(()=>{if(!button.isConnected)return;button.innerHTML='<i data-lucide="copy"></i>';refreshIcons()},1000)});
  }
  function bindTripFilters(){
    screen.querySelectorAll('[data-trip-filter]').forEach(button=>button.onclick=()=>{
      const value=button.dataset.tripFilter;
      screen.querySelectorAll('[data-trip-filter]').forEach(item=>item.classList.toggle('on',item===button));
      screen.querySelectorAll('[data-trip-card]').forEach(card=>{card.style.display=value==='all'||card.dataset.tripCard===value?'block':'none'});
    });
  }
  function bindSettings(){
    const themeTitles={system:'Системная',light:'Светлая',dark:'Тёмная'};
    const languageTitles={RU:'Русский',EN:'English',ES:'Español',DE:'Deutsch'};
    screen.querySelector('[data-settings-current="theme"]')?.replaceChildren(document.createTextNode(themeTitles[previewTheme]));
    screen.querySelector('[data-settings-current="language"]')?.replaceChildren(document.createTextNode(languageTitles[previewLanguage]));
    screen.querySelectorAll('[data-settings-choice="theme"]').forEach(item=>item.classList.toggle('on',item.dataset.value===previewTheme));
    screen.querySelectorAll('[data-settings-choice="language"]').forEach(item=>item.classList.toggle('on',item.dataset.value===previewLanguage));
    screen.querySelectorAll('[data-settings-toggle]').forEach(button=>button.onclick=()=>{
      const options=button.parentElement.querySelector(`[data-settings-options="${button.dataset.settingsToggle}"]`);
      if(options)options.classList.toggle('open');
    });
    screen.querySelectorAll('[data-settings-choice]').forEach(choice=>choice.onclick=()=>{
      const key=choice.dataset.settingsChoice;
      const options=choice.closest('[data-settings-options]');
      const group=choice.closest('.settings-group');
      if(key==='theme')previewTheme=choice.dataset.value;
      if(key==='language')previewLanguage=choice.dataset.value;
      options?.querySelectorAll('[data-settings-choice]').forEach(item=>item.classList.toggle('on',item===choice));
      group?.querySelector(`[data-settings-current="${key}"]`)?.replaceChildren(document.createTextNode(choice.textContent));
      options?.classList.remove('open');
    });
    const photoInput=document.createElement('input');
    photoInput.type='file';photoInput.accept='image/*';photoInput.hidden=true;
    photoInput.onchange=()=>{
      const file=photoInput.files?.[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{
        previewAvatarDataUrl=String(reader.result||'');
        const avatar=screen.querySelector('.settings-avatar');
        if(avatar&&previewAvatarDataUrl){avatar.textContent='';avatar.style.backgroundImage=`url("${previewAvatarDataUrl}")`;avatar.style.backgroundSize='cover';avatar.style.backgroundPosition='center';}
      };
      reader.readAsDataURL(file);
    };
    screen.append(photoInput);
    const avatar=screen.querySelector('.settings-avatar');
    if(avatar&&previewAvatarDataUrl){avatar.textContent='';avatar.style.backgroundImage=`url("${previewAvatarDataUrl}")`;avatar.style.backgroundSize='cover';avatar.style.backgroundPosition='center';}
    const targets={'Уведомления':'notifications','Сменить пароль':'password','Сменить фото':'photo'};
    screen.querySelectorAll('.settings-row').forEach(row=>{
      const title=row.querySelector('.settings-row-main b')?.textContent.trim();
      const target=title&&targets[title];
      if(!target)return;
      row.onclick=()=>target==='photo'?photoInput.click():show(target);
    });
    const notificationRow=Array.from(screen.querySelectorAll('.settings-row')).find(row=>row.querySelector('.settings-row-main b')?.textContent.trim()==='Уведомления');
    notificationRow?.querySelector('.settings-row-value')?.replaceChildren(document.createTextNode(previewNotificationsEnabled?'Включены':'Выключены'));
  }
  function bindNotifications(){
    const master=screen.querySelector('.notification-toggle');
    if(!master)return;
    const trip=screen.querySelector('[data-notification-kind="trip"]');
    const cancellation=screen.querySelector('[data-notification-kind="cancellation"]');
    const payment=screen.querySelector('[data-notification-kind="payment"]');
    const email=screen.querySelector('[data-notification-kind="email"]');
    const emailPayment=screen.querySelector('[data-notification-kind="email-payment"]');
    const hour=screen.querySelector('[data-notification-hour]');
    const status=screen.querySelector('[data-notification-status]');
    const permission=screen.querySelector('[data-notification-permission]');
    const permissionText=screen.querySelector('[data-notification-permission-text]');
    const permissionDetail=screen.querySelector('[data-notification-permission-detail]');
    const emailTarget=screen.querySelector('[data-notification-email-target]');
    const message=screen.querySelector('[data-notification-message]');
    master.checked=previewNotificationsEnabled;
    if(trip)trip.checked=previewTripReminders;
    if(cancellation)cancellation.checked=previewCancellationReminders;
    if(payment)payment.checked=previewPaymentReminders;
    if(email)email.checked=previewEmailNotifications;
    if(emailPayment)emailPayment.checked=previewEmailPaymentReminders;
    if(hour)hour.value=previewReminderHour;
    if(emailTarget)emailTarget.textContent=previewEmailRecipient;
    const update=()=>{
      previewNotificationsEnabled=master.checked;
      if(trip)previewTripReminders=trip.checked;
      if(cancellation)previewCancellationReminders=cancellation.checked;
      if(payment)previewPaymentReminders=payment.checked;
      if(email)previewEmailNotifications=email.checked;
      if(emailPayment)previewEmailPaymentReminders=emailPayment.checked;
      if(hour&&hour.dataset.notificationHour)previewReminderHour=hour.dataset.notificationHour;
      [trip,cancellation,payment].forEach(input=>{if(input){input.disabled=!master.checked;input.closest('.notification-toggle-row').classList.toggle('disabled',!master.checked);}});
      if(emailPayment){emailPayment.disabled=!email.checked;emailPayment.closest('.notification-toggle-row').classList.toggle('disabled',!email.checked);}
      if(status)status.textContent=master.checked?'Включены':'Выключены';
      if(permission){
        permission.classList.toggle('off',!previewPhonePermissionGranted);
        if(permissionText)permissionText.textContent=previewPhonePermissionGranted?'Разрешение телефона включено':'Разрешите уведомления телефона';
        if(permissionDetail)permissionDetail.textContent=previewPhonePermissionGranted?'Ramingo сможет напоминать о важных датах.':'Нажмите, чтобы открыть системное разрешение.';
        permission.querySelector('svg')?.setAttribute('data-lucide',previewPhonePermissionGranted?'check':'bell');
      }
      refreshIcons();
    };
    master.onchange=update;trip?.addEventListener('change',update);cancellation?.addEventListener('change',update);payment?.addEventListener('change',update);email?.addEventListener('change',update);emailPayment?.addEventListener('change',update);
    screen.querySelector('[data-notification-time]')?.addEventListener('click',()=>{
      const next=prompt('Время напоминаний (например, 09:00)',previewReminderHour);
      if(!next)return;
      const match=String(next).trim().match(/^([01]?\d|2[0-3]):00$/);
      if(!match){if(message){message.classList.add('error');message.textContent='Введите время в формате ЧЧ:00';}return;}
      previewReminderHour=String(next).trim().padStart(5,'0');
      if(hour)hour.textContent=previewReminderHour;
      if(message){message.classList.remove('error');message.textContent='';}
    });
    screen.querySelectorAll('[data-notification-preset]').forEach(button=>button.onclick=()=>{
      const index=Number(button.dataset.notificationPreset);
      screen.querySelectorAll('[data-notification-preset]').forEach(item=>item.classList.toggle('on',item===button));
      master.checked=true;
      if(index===1){trip.checked=false;cancellation.checked=true;payment.checked=true}
      else{trip.checked=true;cancellation.checked=true;payment.checked=true}
      update();
    });
    screen.querySelector('[data-notification-permission]')?.addEventListener('click',()=>{
      previewPhonePermissionGranted=true;
      update();
    });
    screen.querySelector('[data-notification-email-edit]')?.addEventListener('click',()=>{
      const next=prompt('E-mail для уведомлений',previewEmailRecipient);
      if(!next)return;
      const value=String(next).trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)){if(message){message.classList.add('error');message.textContent='Укажите корректный e-mail';}return;}
      previewEmailRecipient=value;
      if(emailTarget)emailTarget.textContent=value;
      if(message){message.classList.remove('error');message.textContent='';}
    });
    screen.querySelector('[data-notification-help]')?.addEventListener('click',()=>alert('Ramingo напомнит о начале поездки, оплате жилья и дедлайнах бесплатной отмены.'));
    screen.querySelector('[data-notification-save]')?.addEventListener('click',()=>{update();if(message){message.classList.remove('error');message.textContent='Настройки сохранены';}});
    update();
  }
  function bindPassword(){
    const save=screen.querySelector('[data-password-save]');
    if(!save)return;
    const password=screen.querySelector('[data-password="new"]');
    const repeat=screen.querySelector('[data-password="repeat"]');
    const message=screen.querySelector('[data-password-message]');
    save.onclick=()=>{
      const value=password?.value||'';const repeated=repeat?.value||'';
      if(value.length<6){if(message){message.classList.add('error');message.textContent='Пароль должен содержать минимум 6 символов';}return;}
      if(value!==repeated){if(message){message.classList.add('error');message.textContent='Пароли не совпадают';}return;}
      if(message){message.classList.remove('error');message.textContent='Пароль изменён';}
      save.textContent='Сохранено';save.disabled=true;
    };
  }
  function show(id){
    maps.forEach(map=>map.remove());maps=[];
    screen.innerHTML=document.querySelector('#'+id).innerHTML;screen.scrollTop=0;
    const activeView=['settings','notifications','password'].includes(id)?'trips':id;
    document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===activeView));
    screen.querySelectorAll('.hamb').forEach(b=>b.onclick=()=>show('drawer'));
    screen.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(b.dataset.open));
    refreshIcons();bindWeather();bindFilters();bindPets();bindCopies();bindTripFilters();bindSettings();bindNotifications();bindPassword();
    screen.querySelectorAll('[data-map]').forEach(drawMap);
  }
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));show('overview');
</script>
</body>
</html>
